name: Tests (Windows and Linux)

# The tests on Windows and Linux, and the program built on both (a broken build or an import that only fails on
# one system shows up here, not in a release).
on:
  # only when started by hand (Actions tab): GitHub Actions is blocked on this account for a billing issue, and a
  # run on every push failed and sent an email each time. Put back "push:" / "pull_request:" once Actions works.
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "0"   # like a normal Windows install: the code must give the encoding itself
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # pytablericons needs pygame, which has no Windows wheel for 3.14 yet
          cache: pip
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
      - name: The program starts (imports every module of the GUI)
        run: python -c "import Gui, ConvertFiles, SyncEditor, SongMaker, SyncModel, VoiceAlign, UltrastarToSingit; print('ok')"
      - name: Build
        run: pyinstaller "Lets Sing Ultrastar Converter.spec" --noconfirm
